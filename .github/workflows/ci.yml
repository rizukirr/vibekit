name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24+ runs the TypeScript syntax check (type stripping) with no
          # toolchain install. shellcheck is preinstalled on ubuntu-latest.
          node-version: '24'

      # The repo ships no dependencies; the checks run on a bare node. No
      # install step is needed.
      - name: Validate manifests, skills, and package contents
        run: npm run check

  hook:
    name: hook (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The SessionStart hook is the entire vibekit integration: if it fails to
      # execute, every skill is inert with no visible error. The windows-latest
      # leg is the only machine-executed proof that the polyglot wrapper's batch
      # half works; nothing on a Unix dev box can verify it.
      - name: Smoke-test the SessionStart hook
        run: npm run check:hook
