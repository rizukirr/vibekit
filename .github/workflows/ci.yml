name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # The repo ships no dependencies; every check runs on a bare node.
      - name: Check generated files are up to date
        run: npm run check

      - name: Run unit tests
        run: npm test

  hook:
    name: hook (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # The SessionStart hook is the entire integration: if it fails to execute,
      # every skill is inert with no visible error. The windows-latest leg is the
      # only machine-executed proof that the polyglot wrapper's batch half works;
      # nothing on a Unix dev box can verify it.
      - name: Smoke-test the SessionStart hook
        run: npm run check:hook

      # The unit tests once ran only on ubuntu, so Windows-only failures (CRLF
      # frontmatter, backslash paths) reached main. The submission tests need
      # zip and unzip, which this runner lacks, and they run on ubuntu in validate.
      - name: Unit tests on Windows, without the zip-dependent submission tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: node --test (Get-ChildItem tests/*.test.mjs | Where-Object Name -ne 'submission.test.mjs' | ForEach-Object FullName)
